<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F5BD3">
<title>Syllabes et mots · ABC Formation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap">
<style>
/* Une colonne, téléphone d'abord. Couleurs des syllabes reprises des livrets : bleu / orange. */
:root{
  --bg:#F7F3EA; --card:#FFFFFF; --ink:#1F2440; --muted:#5D6280; --line:#E4DCCB;
  --blue:#2F5BD3; --orange:#C2410C; --green:#1E7B4F; --red:#C0392B; --gold:#E0A526;
  --chip:#EFE7D6; --hl:#DCE7FF; --found:#CDEBD9; --bad:#F9D5D0; --sack:#F4E3C3; --sackline:#A9773A;
  --a1:#1E7B4F; --a2:#2F5BD3;
  --font:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#151827; --card:#1F2336; --ink:#EEF0F8; --muted:#A6ABC6; --line:#34395A;
  --blue:#7FA2FF; --orange:#FF9A63; --green:#5CCB93; --red:#FF7A6B; --gold:#F2C14E;
  --chip:#2B3050; --hl:#2C3B6B; --found:#1F4A36; --bad:#4A2424; --sack:#3A3022; --sackline:#C79A5E;
  --a1:#5CCB93; --a2:#7FA2FF; color-scheme:dark}}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;margin:0;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:44px}
.back{border:0;background:var(--chip);border-radius:12px;width:44px;height:44px;font-size:24px;flex:none}
.top h1{font-size:19px;margin:0;flex:1;min-width:0;text-wrap:balance}
.prog{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hero{padding:14px 2px 6px}
.hero h1{font-size:30px;font-weight:800;margin:0 0 4px;letter-spacing:-.5px}
.b{color:var(--blue)}.o{color:var(--orange)}
.hero p{margin:0;color:var(--muted)}
.who{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border-radius:14px;padding:8px 10px 8px 14px;box-shadow:0 0 0 1.5px var(--line) inset;margin-top:12px}
.who b{font-size:18px}.who button{border:0;background:var(--chip);border-radius:10px;padding:8px 12px;font-size:14px}
.lvls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.lvl{border:0;border-radius:20px;padding:18px 14px;text-align:left;color:#fff}
.lvl b{display:block;font-size:34px;font-weight:800}.lvl span{font-size:14px;opacity:.95}
.lvl.a1{background:#1E7B4F}.lvl.a2{background:#2F5BD3}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.th{border:0;background:var(--card);border-radius:18px;padding:0;overflow:hidden;text-align:left;box-shadow:0 0 0 1.5px var(--line) inset}
.th img,.th svg{width:100%;height:92px;object-fit:cover;display:block;background:#F6F1E6}
.th div{padding:8px 10px 10px}.th b{display:block;font-size:16px}.th small{color:var(--muted);font-size:13px}
.levels{display:flex;flex-direction:column;gap:10px}
.lv{display:flex;align-items:center;gap:12px;border:0;background:var(--card);border-radius:16px;padding:12px;text-align:left;box-shadow:0 0 0 1.5px var(--line) inset}
.lv .n{width:42px;height:42px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none}
.lv .t{flex:1;min-width:0}.lv .t b{display:block}.lv .t small{color:var(--muted);font-size:13px}
.stars{color:var(--gold);font-size:15px;letter-spacing:1px;white-space:nowrap}
.card{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 0 0 1.5px var(--line) inset}
.ask{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ask p{margin:0;font-weight:600;flex:1}
.say{border:0;background:var(--hl);color:var(--blue);border-radius:12px;width:48px;height:48px;flex:none;display:flex;align-items:center;justify-content:center}
.say svg{width:24px;height:24px}
.say.big{width:96px;height:96px;border-radius:24px;margin:10px auto}.say.big svg{width:46px;height:46px}
.pic{width:100%;max-width:340px;aspect-ratio:4/3;object-fit:cover;border-radius:14px;display:block;margin:0 auto;background:#F6F1E6}
.pic.sm{max-width:200px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{border:0;background:var(--chip);border-radius:14px;padding:14px;font-size:21px;font-weight:600}
.opt.ok{background:var(--found);color:var(--green)}.opt.no{background:var(--bad);color:var(--red);animation:shake .35s}
.sb{color:var(--blue)}.so{color:var(--orange)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.photos button{border:3px solid transparent;padding:0;border-radius:14px;overflow:hidden;background:var(--chip)}
.photos img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.photos .ok{border-color:var(--green)}.photos .no{border-color:var(--red);animation:shake .35s}
.slots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:14px 0 6px;min-height:58px}
.slot{min-width:62px;height:54px;border-radius:12px;border:2.5px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:700;padding:0 8px;background:transparent}
.slot.full{border-style:solid;border-color:var(--ink)}
.slot.gap{border-color:var(--orange)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:10px}
.tile{border:0;border-radius:12px;min-width:58px;height:52px;padding:0 12px;font-size:22px;font-weight:700;background:var(--chip);box-shadow:0 3px 0 var(--line)}
.tile:active{transform:translateY(2px);box-shadow:none}
.tile[disabled]{opacity:.22;box-shadow:none}
.tile.ok{background:var(--found);color:var(--green)}.tile.no{background:var(--bad);color:var(--red)}
.row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:17px;background:var(--chip)}
.btn.pri{background:var(--blue);color:#fff}
.fb{min-height:30px;text-align:center;font-weight:700;margin-top:10px}
.fb.ok{color:var(--green)}.fb.no{color:var(--red)}
.article{color:var(--muted);font-weight:500}
.word{font-size:34px;font-weight:700;text-align:center;margin:10px 0}
.flash{font-size:44px;font-weight:800;text-align:center;padding:40px 0}
.phrase{font-size:24px;font-weight:600;text-align:center;line-height:1.4;margin:6px 0}
.gapw{display:inline-block;min-width:70px;border-bottom:3px solid var(--orange);margin:0 4px}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.nums button{border:0;background:var(--chip);border-radius:14px;height:60px;font-size:26px;font-weight:800}
.nums .ok{background:var(--found);color:var(--green)}.nums .no{background:var(--bad);color:var(--red)}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.vf button{border:0;border-radius:16px;height:70px;font-size:24px;font-weight:800}
.vf .v{background:var(--found);color:var(--green)}.vf .f{background:var(--bad);color:var(--red)}
.line{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.shake{animation:shake .35s}
.sack{position:relative;background:var(--sack);border:3px solid var(--sackline);border-radius:46% 46% 40% 40% / 30% 30% 60% 60%;padding:46px 14px 30px;margin:16px auto 0;max-width:420px}
.sack:before{content:"";position:absolute;left:50%;top:-16px;width:90px;height:30px;transform:translateX(-50%);background:var(--sack);border:3px solid var(--sackline);border-radius:40% 40% 12px 12px}
.sack .tiles{gap:7px}.sack .tile{background:var(--card);height:46px;font-size:20px}
.build{display:flex;align-items:center;justify-content:center;gap:4px;min-height:56px;border-radius:14px;background:var(--chip);font-size:24px;font-weight:700;padding:6px 10px;margin-top:12px;flex-wrap:wrap}
.targets{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:12px}
.tg{border-radius:12px;overflow:hidden;background:var(--chip);text-align:center;font-size:14px;font-weight:700}
.tg img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;filter:grayscale(1) opacity(.55)}
.tg.done img{filter:none}.tg.done{background:var(--found);color:var(--green)}
.tg span{display:block;padding:3px 2px;min-height:22px}
.gridwrap{overflow-x:auto;margin-top:8px}
.grid{display:grid;gap:3px;margin:0 auto;width:max-content;user-select:none;-webkit-user-select:none}
.cell{display:flex;align-items:center;justify-content:center;font-weight:700;border-radius:7px;background:var(--chip);position:relative}
.cell.fd{background:var(--found);color:var(--green)}
.cell.start{box-shadow:0 0 0 3px var(--blue) inset}
.wl{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
.wl div{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:12px;padding:4px 10px 4px 4px;font-weight:700;font-size:15px}
.wl img{width:42px;height:32px;object-fit:cover;border-radius:8px}
.wl div.done{background:var(--found);color:var(--green);text-decoration:line-through}
.cw .cell{background:var(--card);box-shadow:0 0 0 1.5px var(--line) inset;cursor:pointer}
.cw .blk{background:transparent;box-shadow:none}
.cw .clue{background:var(--ink);overflow:hidden;padding:0}
.cw .clue img{width:100%;height:100%;object-fit:cover;opacity:.92}
.cw .clue i{position:absolute;right:1px;bottom:0;font-style:normal;color:#fff;font-size:14px;font-weight:800;text-shadow:0 0 3px #000}
.cw .clue.two{display:grid;grid-template-rows:1fr 1fr}
.cw .clue.two>div{position:relative;overflow:hidden}
.cw .let.cur{background:var(--hl)}.cw .let.on{box-shadow:0 0 0 3px var(--blue) inset}
.cw .let.bad{color:var(--red)}.cw .let.good{color:var(--green)}
.cluebig{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.cluebig img{width:110px;height:82px;object-fit:cover;border-radius:12px}
.cluebig p{margin:0;font-weight:600;flex:1}
#kb{position:fixed;opacity:0;pointer-events:none;width:1px;height:1px;left:0;top:0;font-size:16px}
.scene{width:100%;border-radius:16px;display:block;background:#F6EFE2;border:2px solid var(--line)}
.scene .m{cursor:pointer}.scene .m.ok circle.halo{fill:#5CCB93;opacity:.55}.scene .m.no{animation:shake .35s}
.prep{color:var(--orange)}
.end{text-align:center;padding:24px 8px}
.end .st{font-size:46px;color:var(--gold);letter-spacing:6px;animation:pop .5s}
.end h2{margin:6px 0}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:18px}
.name input{width:100%;font-family:inherit;font-size:26px;font-weight:700;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-align:center;margin-top:12px}
.voices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.voices button{border:0;background:var(--chip);border-radius:12px;padding:12px;text-align:left;font-size:15px}
.voices button.on{background:var(--hl);color:var(--blue);font-weight:700}
.sync{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<input id="kb" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-hidden="true">
<script src="words.js"></script>
<script src="content.js"></script>
<script>
// ================= connexion au tableau de bord =================
const SB_URL = 'https://srhqqovedripajxzaovk.supabase.co/rest/v1';
const SB_KEY = 'sb_publishable_x9PxEbB9zwxoFKRVHMgpSA_lqjbRcNv';
const store = { get(k) { try { return JSON.parse(localStorage.getItem('dds2_' + k)) } catch (e) { return null } }, set(k, v) { try { localStorage.setItem('dds2_' + k, JSON.stringify(v)) } catch (e) {} } };
let device = store.get('device'); if (!device) { device = Math.random().toString(36).slice(2, 10); store.set('device', device); }
let queue = store.get('queue') || { reponses: [], parties: [] };
let sending = false;
async function flush() {
  if (sending) return; sending = true;
  try {
    for (const table of ['reponses', 'parties']) {
      if (!queue[table].length) continue;
      const batch = queue[table].slice(0, 200);
      const r = await fetch(`${SB_URL}/dds_${table}`, { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify(batch) });
      if (r.ok) { queue[table] = queue[table].slice(batch.length); store.set('queue', queue); }
    }
  } catch (e) {} finally { sending = false; const s = document.getElementById('sync'); if (s) s.textContent = syncTxt(); }
}
const syncTxt = () => { const n = queue.reponses.length + queue.parties.length; return n ? `${n} réponse(s) en attente d’envoi (pas de réseau ?)` : 'Tes réponses sont envoyées au formateur.'; };
setInterval(flush, 15000); window.addEventListener('online', flush);
const S = { name: store.get('name'), level: null, theme: null, game: null, session: null, start: 0 };
const cut = (s, n) => String(s ?? '').slice(0, n);
function logAnswer(question, reponse, attendu, correct) {
  queue.reponses.push({ eleve: cut(S.name, 40), appareil: device, session_id: S.session, niveau: S.level, theme: S.theme, jeu: cut(S.game, 60), question: cut(question, 300), reponse: cut(reponse, 300), attendu: cut(attendu, 300), correct });
  store.set('queue', queue); if (queue.reponses.length >= 5) flush();
}
function logGame(score, total, errors, stars) {
  queue.parties.push({ eleve: cut(S.name, 40), appareil: device, session_id: S.session, niveau: S.level, theme: S.theme, jeu: cut(S.game, 60), score, total, erreurs: errors, etoiles: stars, duree_s: Math.min(99999, Math.round((Date.now() - S.start) / 1000)) });
  store.set('queue', queue); flush();
}

// ================= voix =================
// La voix lit seulement des mots entiers et des phrases (jamais une syllabe seule : les voix des téléphones se trompent sur les syllabes).
let voices = [];
const PREF = [/google.*fran/i, /amélie|amelie/i, /audrey/i, /thomas/i, /denise/i, /henri/i, /vivienne/i, /eloise|éloïse/i, /remi|rémi/i, /natural/i, /enhanced|premium/i];
function loadVoices() { try { voices = speechSynthesis.getVoices().filter(v => /^fr/i.test(v.lang)); } catch (e) { voices = []; } }
try { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {}
function bestVoice() {
  const saved = store.get('voice'); if (saved) { const v = voices.find(v => v.name === saved); if (v) return v; }
  const fr = voices.filter(v => /fr[-_]FR/i.test(v.lang)); const pool = fr.length ? fr : voices;
  for (const re of PREF) { const v = pool.find(v => re.test(v.name)); if (v) return v; }
  return pool[0] || null;
}
function speak(t) {
  if (store.get('mute')) return;
  try { const u = new SpeechSynthesisUtterance(t); u.lang = 'fr-FR'; u.rate = .82; u.pitch = 1; const v = bestVoice(); if (v) u.voice = v; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}
const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const sayBtn = (txt, big) => { const b = $(`<button class="say ${big ? 'big' : ''}" aria-label="Écouter">${SPK}</button>`); b.onclick = () => speak(txt); return b; };

// ================= outils =================
const app = document.getElementById('app');
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const rnd = (n) => Math.floor(Math.random() * n);
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/œ/g, 'oe').toUpperCase();
const full = (w) => w.a ? w.a + (w.a.endsWith('’') ? '' : ' ') + w.w : w.w.charAt(0).toUpperCase() + w.w.slice(1);
const sylHTML = (s) => s.map((x, i) => `<span class="${i % 2 ? 'so' : 'sb'}">${x}</span>`).join('');
const starsTxt = (n) => '★'.repeat(n) + '☆'.repeat(3 - n);
const TH = (id) => WORDS.find(t => t.id === id);
const imgOf = (t, w) => (t.words.find(x => x.w === w) || {}).img;
function topbar(title, back, prog) { const t = $(`<div class="top"><button class="back" aria-label="Retour">‹</button><h1>${title}</h1><span class="prog">${prog || ''}</span></div>`); t.querySelector('.back').onclick = back; return t; }
function begin(theme, gameName) { S.theme = theme; S.game = gameName; S.session = Date.now().toString(36) + Math.random().toString(36).slice(2, 6); S.start = Date.now(); }
function finish(total, errors, again, back) {
  const score = Math.max(0, total - errors);
  const s = errors === 0 ? 3 : errors <= Math.max(2, Math.round(total / 4)) ? 2 : 1;
  const key = S.level + '_' + S.theme + '_' + S.game;
  if (s > (store.get(key) || 0)) store.set(key, s);
  logGame(score, total, errors, s);
  app.querySelector('.card') && app.querySelector('.card').remove();
  const e = $(`<div class="card end"><div class="st">${starsTxt(s)}</div><h2>${s === 3 ? 'Bravo !' : s === 2 ? 'Très bien !' : 'C’est bien, on continue !'}</h2><p>${errors === 0 ? 'Aucune erreur.' : errors + (errors > 1 ? ' erreurs.' : ' erreur.')}</p><div class="row"><button class="btn">Rejouer</button><button class="btn pri">Autres jeux</button></div><p class="sync" id="sync">${syncTxt()}</p></div>`);
  const [b1, b2] = e.querySelectorAll('button'); b1.onclick = again; b2.onclick = back;
  app.append(e); speak(s === 3 ? 'Bravo !' : 'Très bien !');
}

// ================= liste des jeux =================
const GAMES = {
  A1: [
    { id: 'quiz', name: 'Je regarde, je choisis', hint: 'La photo et 3 mots' },
    { id: 'ecoute', name: 'J’écoute, je touche', hint: 'J’écoute le mot, je touche la photo' },
    { id: 'ordre', name: 'Les syllabes en ordre', hint: 'Je remets les syllabes' },
    { id: 'manque', name: 'La syllabe qui manque', hint: 'Je trouve la syllabe' },
    { id: 'compte', name: 'Combien de syllabes ?', hint: 'Je tape dans les mains et je compte' },
    { id: 'eclair', name: 'Le mot éclair', hint: 'Le mot passe vite : je retrouve la photo' },
  ],
  A2: [
    { id: 'cache', name: 'Le mot caché', hint: 'Des syllabes en trop' },
    { id: 'sac', name: 'Le sac à syllabes', hint: 'Je trouve les mots du sac' },
    { id: 'meles', name: 'Mots mêlés', hint: 'Je trouve les mots dans la grille' },
    { id: 'fleches', name: 'Mots fléchés', hint: 'J’écris les mots avec les photos' },
    { id: 'gram', name: 'Le bon petit mot', hint: 'Grammaire : je choisis' },
    { id: 'phrase', name: 'La phrase en désordre', hint: 'Je remets les mots dans l’ordre' },
    { id: 'vf', name: 'Vrai ou faux ?', hint: 'Je lis la phrase et je regarde la photo' },
  ],
};
const PRES_GAMES = { A1: ['quiz', 'ecoute', 'ordre', 'compte'], A2: ['gram', 'phrase', 'vf'] };
const SOURIS = { A1: [{ id: 's1', name: 'Où est la souris ?', hint: 'sur, sous, dans, à côté de' }], A2: [{ id: 's2', name: 'Où est la souris ? (difficile)', hint: 'avec devant, derrière, entre' }, { id: 's3', name: 'J’écoute et je touche la souris', hint: 'Seulement le son' }] };

// ================= écrans =================
function nameScreen() {
  app.innerHTML = '';
  app.append($(`<div class="hero"><h1><span class="b">Sylla</span><span class="o">bes</span> et mots</h1><p>ABC Formation · groupe DDS</p></div>`));
