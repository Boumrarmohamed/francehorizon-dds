<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F2EE">
<title>Syllabes et mots · ABC Formation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap">
<style>
/* Téléphone d'abord. Style repris du « Jeu des métiers » : fond clair, cartes blanches, grosses étiquettes, bouton bleu nuit. */
:root{
  --bg:#F3F2EE; --card:#FFFFFF; --ink:#1B1F33; --muted:#636779; --line:#DEDBD3; --soft:#F0EFEA; --slot:#EDF0EA;
  --navy:#1B1F33; --navyink:#FFFFFF; --a1:#0F766E; --a2:#B4441A;
  --blue:#2F5BD3; --orange:#C2410C; --green:#157347; --greenbg:#DDF3E6; --red:#B42318; --redbg:#FBE1DD; --gold:#E0A526; --rv:#FFF1D6;
  --font:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#14161F; --card:#1E2130; --ink:#EEF0F8; --muted:#A6ABC6; --line:#343850; --soft:#2A2E42; --slot:#262A3B;
  --navy:#E9ECF7; --navyink:#14161F; --a1:#34B3A6; --a2:#F08A5D;
  --blue:#7FA2FF; --orange:#FF9A63; --green:#5CCB93; --greenbg:#173B2A; --red:#FF8A7A; --redbg:#4A2420; --gold:#F2C14E; --rv:#4A3A1C; color-scheme:dark}}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;margin:0;-webkit-tap-highlight-color:transparent}
#app{max-width:1000px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 40px max(14px,env(safe-area-inset-left))}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.narrow{max-width:640px;margin:0 auto}

/* barre du haut */
.top{display:flex;align-items:center;gap:12px;min-height:48px;margin-bottom:8px}
.back{border:1.5px solid var(--line);background:var(--card);border-radius:14px;width:46px;height:46px;font-size:26px;line-height:1;flex:none}
.top h1{font-size:21px;font-weight:800;margin:0;flex:1;min-width:0;text-wrap:balance}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:0 0 12px}
.bar i{display:block;height:100%;background:var(--navy);border-radius:99px;transition:width .3s}

/* accueil */
.hero{padding:16px 2px 4px}
.hero h1{font-size:32px;font-weight:800;margin:0 0 4px;letter-spacing:-.5px}
.hero p{margin:0;color:var(--muted)}
.b{color:var(--blue)}.o{color:var(--orange)}
.who{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border-radius:16px;padding:8px 8px 8px 14px;border:1.5px solid var(--line);margin-top:14px}
.who b{font-size:18px}
.who .btns{display:flex;gap:6px}
.chipbtn{border:1.5px solid var(--line);background:var(--soft);border-radius:12px;padding:9px 12px;font-size:14px;font-weight:600}
.lvls{display:grid;gap:12px;margin-top:14px}
.lvl{border:0;border-radius:22px;padding:18px 18px 16px;text-align:left;color:#fff;display:flex;align-items:center;gap:16px}
.lvl b{font-size:44px;font-weight:800;line-height:1}
.lvl .t{flex:1}.lvl .t strong{display:block;font-size:19px}.lvl .t span{font-size:14px;opacity:.95;display:block;margin-top:2px}
.lvl.a1{background:#0F766E}.lvl.a2{background:#B4441A}
.lvl .pc{font-size:13px;background:rgba(255,255,255,.2);border-radius:99px;padding:4px 10px;white-space:nowrap}
@media(min-width:720px){.lvls{grid-template-columns:1fr 1fr}}

/* thèmes : grille de cartes photo (même organisation qu'avant) */
.themes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:720px){.themes{grid-template-columns:repeat(3,1fr)}}
.th{border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:0;overflow:hidden;text-align:left}
.th img,.th svg{width:100%;height:104px;object-fit:cover;display:block;background:#F6F1E6}
.th div{padding:9px 11px 11px}.th b{display:block;font-size:17px}.th small{color:var(--muted);font-size:13px}
.th .done{color:var(--gold)}
.lvtag{display:inline-block;color:#fff;border-radius:8px;padding:2px 8px;font-size:14px;font-weight:700;margin-left:6px;vertical-align:2px}
.lvtag.A1{background:#0F766E}.lvtag.A2{background:#B4441A}

/* liste des activités */
.levels{display:flex;flex-direction:column;gap:10px}
.lv{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:12px;text-align:left}
.lv .n{width:44px;height:44px;border-radius:13px;background:var(--navy);color:var(--navyink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none}
.lv .t{flex:1;min-width:0}.lv .t b{display:block;font-size:17px}.lv .t small{color:var(--muted);font-size:13px}
.stars{color:var(--gold);font-size:16px;letter-spacing:1px;white-space:nowrap}
.rule{font-size:14px;color:var(--muted);background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;margin:0 0 12px}

/* carte de jeu : photo à gauche / exercice à droite sur ordinateur, l'un sous l'autre sur téléphone */
.g{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:14px;display:grid;gap:14px}
@media(min-width:820px){.g.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding:22px;gap:24px;align-items:start}}
.g.one{max-width:680px;margin:0 auto}
.ph{position:relative}
.ph img{width:100%;aspect-ratio:4/3;max-height:36vh;object-fit:cover;border-radius:16px;display:block;background:#F6F1E6}
@media(min-width:820px){.ph img{max-height:none}}
.count{position:absolute;left:10px;top:10px;background:#fff;color:#1B1F33;border-radius:99px;padding:4px 11px;font-size:14px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.ask{display:flex;align-items:flex-start;gap:10px}
.ask p{margin:0;font-weight:700;font-size:19px;flex:1;line-height:1.35}
.say{border:0;background:var(--soft);border:1.5px solid var(--line);color:var(--ink);border-radius:14px;width:50px;height:50px;flex:none;display:flex;align-items:center;justify-content:center}
.say svg{width:24px;height:24px}
.listen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--soft);border-radius:18px;padding:22px;min-height:170px}
.listen .say{width:110px;height:110px;border-radius:28px;background:var(--navy);color:var(--navyink);border:0}
.listen .say svg{width:52px;height:52px}
.listen span{font-weight:600;color:var(--muted)}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}

/* réponses */
.opts{display:grid;gap:10px}
.opts.row2{grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px 12px;font-size:21px;font-weight:700;text-align:center;line-height:1.25}
.opt.small{font-size:18px;font-weight:600}
.opt .art{color:var(--muted);font-weight:500}
.sb{color:var(--blue)}.so{color:var(--orange)}
.is-ok{background:var(--greenbg)!important;border-color:var(--green)!important;color:var(--green)}
.is-no{background:var(--redbg)!important;border-color:var(--red)!important;color:var(--red);animation:shake .35s}
.is-ok .sb,.is-ok .so,.is-ok .art,.is-no .sb,.is-no .so,.is-no .art{color:inherit}
.dim{opacity:.45}
.locked .act{pointer-events:none}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos button{border:3px solid var(--line);padding:0;border-radius:16px;overflow:hidden;background:var(--soft)}
.photos img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.photos .is-ok{border-color:var(--green)!important}.photos .is-no{border-color:var(--red)!important}

/* syllabes : grosses étiquettes */
.slots{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:66px}
.slot{min-width:76px;height:66px;border-radius:14px;border:2.5px dashed #CFCBC2;background:var(--slot);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;padding:0 10px}
.slot.full{border-style:solid;border-color:var(--ink);background:var(--card)}
.slot.fix{border:0;background:transparent;min-width:auto;padding:0 2px}
.slot.gap{border-color:var(--orange)}
.art-l{font-size:30px;color:var(--muted);font-weight:500;margin-right:2px}
.tiles{display:flex;flex-wrap:wrap;gap:10px}
.tile{border:2px solid var(--line);background:var(--card);border-radius:14px;min-width:72px;height:64px;padding:0 14px;font-size:30px;font-weight:800;box-shadow:0 2px 0 var(--line)}
.tile:active{transform:translateY(2px);box-shadow:none}
.tile[disabled]{opacity:.2;box-shadow:none}
.tile.sm{font-size:21px;height:52px;min-width:52px;font-weight:700}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);border-radius:14px;padding:13px 18px;font-weight:700;font-size:17px;background:var(--soft)}
.btn.pri{background:var(--navy);color:var(--navyink);border-color:var(--navy)}
.btn.wide{width:100%}
.build{display:flex;align-items:center;flex-wrap:wrap;gap:4px;min-height:62px;border-radius:14px;background:var(--slot);border:2.5px dashed #CFCBC2;font-size:28px;font-weight:800;padding:6px 12px}
.build.ph-txt{font-size:16px;font-weight:500;color:var(--muted)}
.word{font-size:36px;font-weight:800;text-align:center}
.word .art{color:var(--muted);font-weight:500}
.flash{font-size:50px;font-weight:800;text-align:center;padding:50px 0}
.phrase{font-size:24px;font-weight:700;line-height:1.45;text-align:center}
.gapw{display:inline-block;min-width:74px;border-bottom:3px solid var(--orange);margin:0 4px}
.hlp{color:var(--orange)}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.nums button{border:2px solid var(--line);background:var(--card);border-radius:16px;height:64px;font-size:28px;font-weight:800}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf button{border:2px solid var(--line);background:var(--card);border-radius:18px;height:72px;font-size:24px;font-weight:800}

/* retour après la réponse : une seule réponse, puis on passe à la suite */
.fb{border-radius:16px;padding:12px 12px 12px 14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;line-height:1.35;position:relative;overflow:hidden;animation:pop .3s}
.fb.ok{background:var(--greenbg);color:var(--green)}
.fb.no{background:var(--redbg);color:var(--red)}
.fb .m{flex:1}
.fb .m small{display:block;font-weight:500;font-size:15px;color:var(--ink)}
.fb .nx{border:0;background:var(--navy);color:var(--navyink);border-radius:12px;padding:10px 14px;font-weight:700;font-size:16px;flex:none}
.fb .tm{position:absolute;left:0;bottom:0;height:4px;background:currentColor;opacity:.35;animation:tm linear forwards}
@keyframes tm{from{width:100%}to{width:0}}

/* bulle, fiche, texte */
.bubble{background:var(--soft);border-radius:20px 20px 20px 6px;padding:20px 18px;font-size:24px;font-weight:700;display:flex;gap:12px;align-items:center}
.bubble p{margin:0;flex:1}
.fiche{border:2px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--card)}
.fiche h3{margin:0;background:var(--navy);color:var(--navyink);font-size:15px;letter-spacing:.06em;padding:9px 12px;text-transform:uppercase}
.fiche .in{display:flex;gap:12px;padding:12px}
.fiche svg{width:64px;height:78px;flex:none;border-radius:8px;background:var(--soft)}
.fiche dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:16px;flex:1}
.fiche dt{color:var(--muted)}.fiche dd{margin:0;font-weight:700}
.fiche dd.cur{color:var(--orange)}
.fiche dd.bad{color:var(--orange)}
.txt{background:var(--soft);border-radius:16px;padding:14px 16px;font-size:18px;line-height:1.6;max-height:34vh;overflow:auto}
@media(min-width:820px){.txt{max-height:none}}
.txt h3{margin:0 0 6px;font-size:18px}
.txtbtn{margin-top:8px}

/* grilles */
.gridwrap{overflow-x:auto;padding-bottom:4px}
.grid{display:grid;gap:3px;margin:0 auto;width:max-content;user-select:none;-webkit-user-select:none}
.cell{display:flex;align-items:center;justify-content:center;font-weight:700;border-radius:7px;background:var(--soft);position:relative}
.cell.fd{background:var(--greenbg);color:var(--green)}
.cell.rv{background:var(--rv);color:var(--orange)}
.cell.start{box-shadow:0 0 0 3px var(--blue) inset}
.cw .cell{background:var(--card);box-shadow:0 0 0 1.5px var(--line) inset}
.cw .blk{background:transparent;box-shadow:none}
.cw .clue{background:var(--ink);overflow:hidden;padding:0}
.cw .clue img{width:100%;height:100%;object-fit:cover;opacity:.92}
.cw .clue i{position:absolute;right:1px;bottom:0;font-style:normal;color:#fff;font-size:13px;font-weight:800;text-shadow:0 0 3px #000}
.cw .clue.two{display:grid;grid-template-rows:1fr 1fr}
.cw .clue.two>div{position:relative;overflow:hidden}
.cw .clue.on{box-shadow:0 0 0 3px var(--blue)}
.cw .cur{background:#E4ECFF}.cw .cur.next{box-shadow:0 0 0 3px var(--blue) inset}
.cw .fd{background:var(--greenbg);color:var(--green)}.cw .rv{background:var(--rv);color:var(--orange)}
.target{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:16px;padding:8px}
.target img{width:96px;height:72px;object-fit:cover;border-radius:12px;flex:none}
.target b{font-size:24px}
.target span{color:var(--muted);font-weight:600}

/* sac */
.sack{position:relative;background:#F4E3C3;border:3px solid #A9773A;border-radius:46% 46% 40% 40% / 30% 30% 60% 60%;padding:42px 12px 28px;margin:14px auto 0;width:100%}
.sack:before{content:"";position:absolute;left:50%;top:-16px;width:90px;height:30px;transform:translateX(-50%);background:#F4E3C3;border:3px solid #A9773A;border-radius:40% 40% 12px 12px}
.sack .tiles{justify-content:center;gap:8px}.sack .tile{font-size:24px;height:54px;min-width:60px}

/* souris */
.scene{width:100%;border-radius:16px;display:block;background:#F6EFE2;border:2px solid var(--line)}
.scene .m{cursor:pointer}
.scene .m.is-ok circle.halo{fill:#5CCB93;opacity:.6}.scene .m.is-no circle.halo{fill:#F28B7C;opacity:.6}

/* fin */
.end{text-align:center;padding:26px 16px}
.end .st{font-size:50px;color:var(--gold);letter-spacing:6px;animation:pop .5s}
.end h2{margin:6px 0 2px;font-size:26px}
.end .sc{font-size:20px;font-weight:700;margin:0 0 6px}
.review{text-align:left;margin:16px 0 4px;display:flex;flex-direction:column;gap:8px}
.review div{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:16px}
.review b{color:var(--green)}
.end .tools{justify-content:center;margin-top:16px}

/* formulaire « ma présentation » */
.form{display:flex;flex-direction:column;gap:14px}
.fl label{display:block;font-weight:700;margin-bottom:6px}
.fl input,.fl select{width:100%;font-family:inherit;font-size:19px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:9px 14px;font-size:16px;font-weight:600}
.chip.on{background:var(--navy);color:var(--navyink);border-color:var(--navy)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:26px;font-weight:800}
.stepper b{font-size:28px;min-width:40px;text-align:center}
.para{background:var(--soft);border-radius:18px;padding:18px;font-size:21px;line-height:1.65;font-weight:500}
.para b{color:var(--blue)}
.err{color:var(--red);font-weight:700;min-height:22px}

.name input{width:100%;font-family:inherit;font-size:26px;font-weight:700;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-align:center}
.voices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.voices button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px;text-align:left;font-size:15px}
.voices button.on{background:var(--navy);color:var(--navyink);font-weight:700}
.sync{font-size:13px;color:var(--muted);text-align:center;margin-top:14px}
.note{font-size:14px;color:var(--muted);text-align:center;margin:0}
.card{background:var(--card);border-radius:22px;padding:16px;border:1.5px solid var(--line)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.94);opacity:.4}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="words.js"></script>
<script src="content.js"></script>
<script>
// ================= envoi des réponses au tableau de bord (Supabase, insertion seule) =================
const SB_URL = 'https://srhqqovedripajxzaovk.supabase.co/rest/v1';
const SB_KEY = 'sb_publishable_x9PxEbB9zwxoFKRVHMgpSA_lqjbRcNv';
const store = { get(k) { try { return JSON.parse(localStorage.getItem('dds2_' + k)) } catch (e) { return null } }, set(k, v) { try { localStorage.setItem('dds2_' + k, JSON.stringify(v)) } catch (e) {} } };
let device = store.get('device'); if (!device) { device = Math.random().toString(36).slice(2, 10); store.set('device', device); }
let queue = store.get('queue') || { reponses: [], parties: [] };
let sending = false;
async function flush() {
  if (sending) return; sending = true;
  try {
    for (const table of ['reponses', 'parties']) {
      if (!queue[table].length) continue;
      const batch = queue[table].slice(0, 200);
      const r = await fetch(`${SB_URL}/dds_${table}`, { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify(batch) });
      if (r.ok) { queue[table] = queue[table].slice(batch.length); store.set('queue', queue); }
    }
  } catch (e) {} finally { sending = false; const s = document.getElementById('sync'); if (s) s.textContent = syncTxt(); }
}
const syncTxt = () => { const n = queue.reponses.length + queue.parties.length; return n ? `${n} réponse(s) en attente d’envoi (pas de réseau ?)` : 'Tes réponses sont envoyées au formateur.'; };
setInterval(flush, 15000); window.addEventListener('online', flush);
const S = { name: store.get('name'), level: null, theme: null, game: null, gameId: null, session: null, start: 0 };
const cut = (s, n) => String(s ?? '').slice(0, n);
const plain = (h) => String(h ?? '').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ');
function logAnswer(question, reponse, attendu, correct) {
  queue.reponses.push({ eleve: cut(S.name, 40), appareil: device, session_id: S.session, niveau: S.level, theme: S.theme, jeu: cut(S.game, 60), question: cut(plain(question), 400), reponse: cut(plain(reponse), 1200), attendu: cut(plain(attendu), 400), correct });
  store.set('queue', queue); if (queue.reponses.length >= 5) flush();
}
function logGame(score, total, errors, stars) {
  queue.parties.push({ eleve: cut(S.name, 40), appareil: device, session_id: S.session, niveau: S.level, theme: S.theme, jeu: cut(S.game, 60), score, total, erreurs: errors, etoiles: stars, duree_s: Math.min(99999, Math.round((Date.now() - S.start) / 1000)) });
  store.set('queue', queue); flush();
}

// ================= voix (mots entiers et phrases seulement, jamais une syllabe seule) =================
let voices = [];
const PREF = [/google.*fran/i, /amélie|amelie/i, /audrey/i, /thomas/i, /denise/i, /henri/i, /vivienne/i, /eloise|éloïse/i, /remi|rémi/i, /natural/i, /enhanced|premium/i];
function loadVoices() { try { voices = speechSynthesis.getVoices().filter(v => /^fr/i.test(v.lang)); } catch (e) { voices = []; } }
try { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {}
function bestVoice() {
  const saved = store.get('voice'); if (saved) { const v = voices.find(v => v.name === saved); if (v) return v; }
  const fr = voices.filter(v => /fr[-_]FR/i.test(v.lang)); const pool = fr.length ? fr : voices;
  for (const re of PREF) { const v = pool.find(v => re.test(v.name)); if (v) return v; }
  return pool[0] || null;
}
function speak(t) {
  if (store.get('mute') || !t) return;

}

const rnd = (n) => Math.floor(Math.random() * n);
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/œ/g, 'oe').toUpperCase();
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

let timer = null;
function pic(img, count) { return $(`<div class="ph"><img alt="" src="${img}">${count ? `<span class="count">${count}</span>` : ''}</div>`); }
function runSeries(items, build, back) {
  let i = 0, good = 0; const errs = [];
  const next = () => {
    clearTimeout(timer);
    if (i >= items.length) return endScreen(items.length, good, errs, back);
    app.innerHTML = '';
    app.append(topbar(S.game, back));
    app.append($(`<div class="bar"><i style="width:${Math.round(i / items.length * 100)}%"></i></div>`));
    let done = false;
    const ctx = {
      count: `${i + 1} / ${items.length}`,
      // ok : bonne ou mauvaise réponse · q/r/a : pour le formateur · right : la bonne réponse à afficher · say : à lire
      answer(ok, { q, r, a, right, say }) {
        if (done) return; done = true;
        g.classList.add('locked');
        logAnswer(q, r, a, ok);
        if (ok) good++; else errs.push({ q: plain(q), a: right || a });
        const wait = ok ? 1500 : 3200;
        const f = $(`<div class="fb ${ok ? 'ok' : 'no'}"><div class="m">${ok ? '✓ Bravo !' : '✗ Non.'}${right ? `<small>${ok ? '' : 'La bonne réponse : '}${right}</small>` : ''}</div><button class="nx">Suivant ›</button><i class="tm" style="animation-duration:${wait}ms"></i></div>`);
        f.querySelector('.nx').onclick = () => { i++; next(); };
        (g.querySelector('.side') || g).append(f);
        if (say) speak(say);
        timer = setTimeout(() => { i++; next(); }, wait);
        if (window.innerWidth < 820) setTimeout(() => f.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 50);
      },
    };
    const g = build(items[i], ctx);
    app.append(g);
  };
  next();
}

function gcard(media, askTxt, sayTxt) {

  g.append(side); return { g, side };
}
function endScreen(total, good, errs, back) {
  clearTimeout(timer);
  const ratio = good / total; const s = ratio === 1 ? 3 : ratio >= .7 ? 2 : 1;
  const key = keyOf(S.theme, S.gameId); if (s > (store.get(key) || 0)) store.set(key, s);
  logGame(good, total, total - good, s);
  app.innerHTML = ''; app.append(topbar(S.game, back));
  const e = $(`<div class="card end narrow"><div class="st">${starsTxt(s)}</div><h2>${s === 3 ? 'Bravo !' : s === 2 ? 'Très bien !' : 'On continue !'}</h2><p class="sc">${good} / ${total} bonnes réponses</p></div>`);
  if (errs.length) { const r = $('<div class="review"></div>'); r.append($('<p style="margin:0;font-weight:700">Je retiens :</p>')); errs.forEach(x => r.append($(`<div>${x.q} → <b>${x.a}</b></div>`))); e.append(r); }

  e.append($(`<p class="sync" id="sync">${syncTxt()}</p>`));
  app.append(e); speak(s === 3 ? 'Bravo !' : 'Très bien !');
}

function gSyll(t, gap) {
  const all = [...new Set(t.words.flatMap(w => w.s))];
  runSeries(pick(t, 8, w => w.s.length >= 2), (w, ctx) => {
    const { g, side } = gcard(pic(w.img, ctx.count), gap ? 'Il manque une syllabe. Je la trouve.' : 'Je touche les syllabes dans l’ordre.', full(w));
    const S2 = $('<div class="slots"></div>'), T = $('<div class="tiles act"></div>'), tools = $('<div class="tools act"><button class="btn">Effacer</button></div>');
    side.append(S2, T, tools);
    let tiles, slots, fixed = [], k0 = 0;
    if (gap) { k0 = rnd(w.s.length); fixed = w.s.map((s, j) => j === k0 ? null : s); tiles = shuffle([w.s[k0], ...shuffle(all.filter(s => !w.s.includes(s))).slice(0, 3)]); slots = [null]; tools.remove(); }
    else { tiles = shuffle([...w.s, ...shuffle(all.filter(s => !w.s.includes(s))).slice(0, 2)]); slots = w.s.map(() => null); }
    let over = false;
    const draw = () => {
      S2.innerHTML = '';
      if (w.a) S2.append($(`<span class="art-l">${w.a}</span>`));
      if (gap) fixed.forEach((s, j) => S2.append(s !== null ? $(`<span class="slot fix"><span class="${j % 2 ? 'so' : 'sb'}">${s}</span></span>`) : $(`<span class="slot gap ${slots[0] !== null ? 'full' : ''}">${slots[0] !== null ? `<span class="${j % 2 ? 'so' : 'sb'}">${tiles[slots[0]]}</span>` : ''}</span>`)));
      else slots.forEach((v, k) => { const d = $(`<button class="slot act ${v !== null ? 'full' : ''}">${v !== null ? `<span class="${k % 2 ? 'so' : 'sb'}">${tiles[v]}</span>` : ''}</button>`); d.onclick = () => { if (!over && slots[k] !== null) { slots[k] = null; draw(); } }; S2.append(d); });
      T.innerHTML = '';
      tiles.forEach((s, k) => { const b = $(`<button class="tile">${s}</button>`); if (slots.includes(k)) b.disabled = true; b.onclick = () => { const f = slots.indexOf(null); if (f < 0 || over) return; slots[f] = k; draw(); check(); }; T.append(b); });
    };
    const check = () => {
      if (slots.includes(null)) return; over = true;
      const got = gap ? fixed.map(s => s === null ? tiles[slots[0]] : s) : slots.map(k => tiles[k]);
      const ok = got.join('') === w.s.join('');
      S2.querySelectorAll('.slot:not(.fix)').forEach(d => d.classList.add(ok ? 'is-ok' : 'is-no'));
      ctx.answer(ok, { q: (gap ? 'Syllabe qui manque : ' : 'Syllabes : ') + full(w), r: got.join('·'), a: w.s.join('·'), right: wordHTML(w), say: full(w) });
    };
    tools.querySelector('.btn').onclick = () => { if (!over) { slots.fill(null); draw(); } };
    draw(); return g;
  }, backList);
}

    const wd = $(`<div class="word">${w.a ? `<span class="art">${w.a}</span> ` : ''}${w.w}</div>`); side.append(wd);
    const box = $('<div class="nums act"></div>'); const btns = [];

function gNat() { gChoice(shuffle(NATS.filter(n => n.m !== n.f)).slice(0, 8).map(n => ({ q: `Il est ${n.m}. Elle est ___.`, o: [n.f, n.m, n.f + 's'], a: n.f })), backList, 'Il → elle. Je choisis.'); }
function gPhrase(t) {
  runSeries(shuffle(PHRASES[S.theme] || []).slice(0, 6), (p, ctx) => {
    const words = p.split(' ');
    const { g, side } = gcard(null, `${ctx.count} · Je remets les mots dans l’ordre pour faire la phrase.`, p);
    let tiles = shuffle(words.map((w, k) => ({ w, k }))); for (let n = 0; n < 6 && tiles.every((o, k) => o.k === k); n++) tiles = shuffle(tiles);
    const Bd = $('<div class="build" style="font-size:22px"></div>'), T = $('<div class="tiles act"></div>'), tools = $('<div class="tools act"><button class="btn">Effacer</button></div>');
    side.append(Bd, T, tools);
    let picked = [], over = false;
    const draw = () => {
      Bd.className = 'build' + (picked.length ? '' : ' ph-txt'); Bd.style.fontSize = picked.length ? '22px' : '';
      Bd.innerHTML = picked.length ? picked.map(o => o.w).join(' ') : 'Je touche les mots…';
      T.innerHTML = ''; tiles.forEach(o => { const b = $(`<button class="tile sm">${o.w}</button>`); b.disabled = picked.includes(o); b.onclick = () => { if (over) return; picked.push(o); draw(); check(); }; T.append(b); });
    };
    const check = () => {
      if (picked.length < words.length) return; over = true;
      const got = picked.map(o => o.w).join(' '); const ok = got === p;
      Bd.classList.add(ok ? 'is-ok' : 'is-no');
      ctx.answer(ok, { q: 'Phrase : ' + p, r: got, a: p, right: p, say: p });
    };
    tools.querySelector('.btn').onclick = () => { if (!over) { picked = []; draw(); } };
    draw(); return g;
  }, backList);
}
function gVF(t) {
  const items = pick(t, 8).map(w => { const ok = Math.random() < .5; const o = ok ? w : others(t.words, w, 1)[0]; return { w, o, ok }; });
  const say = (o) => { if (!o.a) return 'C’est « ' + o.w + ' ».'; if (o.g === 'p') return 'Ce sont des ' + o.w + '.'; return 'C’est ' + (o.g === 'f' ? 'une ' : 'un ') + o.w + '.'; };
  runSeries(items, (it, ctx) => {
    const ph = say(it.o);
    const { g, side } = gcard(pic(it.w.img, ctx.count), 'Je regarde la photo et je lis la phrase.', ph);
    side.append($(`<div class="phrase">${ph}</div>`));
    const box = $('<div class="vf act"><button>VRAI</button><button>FAUX</button></div>'); const btns = [...box.children];
    btns.forEach((b, k) => { b._o = k === 0; b.onclick = () => { mark(btns, b, x => x._o === it.ok); ctx.answer(b._o === it.ok, { q: 'Vrai/faux : photo ' + it.w.w + ' / ' + ph, r: b._o ? 'vrai' : 'faux', a: it.ok ? 'vrai' : 'faux', right: it.ok ? 'C’est vrai.' : 'C’est faux : ' + say(it.w), say: it.ok ? 'C’est vrai.' : 'C’est faux. ' + say(it.w) }); }; });
    side.append(box); return g;
  }, backList);
}
function textBox(L) { const b = $(`<div><div class="txt"><h3>${L.titre}</h3>${L.texte}</div></div>`); const s = $('<button class="btn txtbtn">🔊 Écouter le texte</button>'); s.onclick = () => speak(L.texte); b.append(s); return b; }
function gLecture() {
  const L = LECTURES[S.theme];
  runSeries(L.q, (it, ctx) => {
    const { g, side } = gcard(textBox(L), `${ctx.count} · ${it.q}`, it.q);
    const box = $(`<div class="opts ${it.o.length === 2 ? 'row2' : ''} act"></div>`); const btns = [];
    (it.o.length === 2 ? it.o : shuffle(it.o)).forEach(o => { const b = $(`<button class="opt small">${o}</button>`); b._o = o; btns.push(b);
      b.onclick = () => { mark(btns, b, x => x._o === it.a); ctx.answer(o === it.a, { q: 'Lecture « ' + L.titre + ' » : ' + it.q, r: o, a: it.a, right: it.a }); }; box.append(b); });
    side.append(box); return g;
  }, backList);
}
function gLucia() {
  const L = LECTURES.presentation; const filled = {};
  runSeries(FICHE_LUCIA, (it, ctx) => {
    const champs = FICHE_LUCIA.map(x => [x.f, x === it ? '?' : (filled[x.f] || '…')]);
    const { g, side } = gcard(textBox(L), `${ctx.count} · Je complète la fiche : ${it.f}`);
    const fi = $(ficheHTML(champs, true, FICHE_LUCIA.indexOf(it)));
    const box = $('<div class="opts act"></div>'); const btns = [];
    shuffle(it.o).forEach(o => { const b = $(`<button class="opt small">${o}</button>`); b._o = o; btns.push(b);
      b.onclick = () => { mark(btns, b, x => x._o === it.a); filled[it.f] = it.a; ctx.answer(o === it.a, { q: 'Fiche de Lucia : ' + it.f, r: o, a: it.a, right: it.f + ' : ' + it.a }); }; box.append(b); });
    side.append(box, fi); return g;
  }, backList);
}

// ================= Ma présentation : je remplis ma fiche, l'appli écrit mon texte, je l'envoie =================
function gMoi() {
  const d = Object.assign({ prenom: S.name || '', nom: '', sexe: '', age: '', nat: '', ville: '', langues: [], sit: '', enf: 0, trav: '', metier: '' }, store.get('moi') || {});
  const save = () => store.set('moi', d);
  app.innerHTML = ''; app.append(topbar(S.game, backList));
  const c = $('<div class="card narrow form"></div>');
  c.append($('<p style="margin:0;font-weight:700;font-size:19px">Je remplis ma fiche. Ensuite, l’appli écrit ma présentation.</p>'));
  const field = (label, el) => { const f = $(`<div class="fl"><label>${label}</label></div>`); f.append(el); c.append(f); return el; };
  const input = (key, ph, type) => { const i = $(`<input ${type ? `type="${type}" inputmode="numeric"` : ''} placeholder="${ph}" autocomplete="off">`); i.value = d[key]; i.oninput = () => { d[key] = i.value; save(); }; return i; };
  const chips = (key, opts, multi, onch) => { const w = $('<div class="chips"></div>'); const draw = () => { w.innerHTML = ''; opts.forEach(([v, lab]) => { const on = multi ? d[key].includes(v) : d[key] === v; const b = $(`<button class="chip ${on ? 'on' : ''}">${lab}</button>`); b.onclick = () => { if (multi) d[key] = on ? d[key].filter(x => x !== v) : [...d[key], v]; else d[key] = v; save(); draw(); onch && onch(); }; w.append(b); }); }; draw(); w._draw = draw; return w; };
  field('Mon prénom', input('prenom', 'Prénom'));
  field('Mon nom', input('nom', 'Nom'));
  const natSel = $('<select></select>');
  const fillNat = () => { const f = d.sexe === 'f'; natSel.innerHTML = '<option value="">— je choisis —</option>' + NATS.map((n, i) => `<option value="${i}" ${String(i) === String(d.nat) ? 'selected' : ''}>${f ? n.f : n.m}</option>`).join(''); };
  natSel.onchange = () => { d.nat = natSel.value; save(); };
  let sitW;
  field('Je suis', chips('sexe', [['m', 'un homme'], ['f', 'une femme']], false, () => { fillNat(); sitW && sitW._draw(); }));
  field('Mon âge', input('age', 'Exemple : 35', 'number'));
  fillNat(); field('Ma nationalité', natSel);
  field('J’habite à (ma ville)', input('ville', 'Exemple : Pontoise'));
  field('Je parle (je touche une ou plusieurs langues)', chips('langues', LANGUES.map(l => [l, l]), true));
  const SIT = () => [['celib', 'célibataire'], ['marie', d.sexe === 'f' ? 'mariée' : 'marié'], ['divorce', d.sexe === 'f' ? 'divorcée' : 'divorcé'], ['veuf', d.sexe === 'f' ? 'veuve' : 'veuf']];
  sitW = $('<div class="chips"></div>'); sitW._draw = () => { sitW.innerHTML = ''; SIT().forEach(([v, lab]) => { const b = $(`<button class="chip ${d.sit === v ? 'on' : ''}">${lab}</button>`); b.onclick = () => { d.sit = v; save(); sitW._draw(); }; sitW.append(b); }); }; sitW._draw();
  field('Situation familiale', sitW);
  const st = $(`<div class="stepper"><button aria-label="moins">−</button><b>${d.enf}</b><button aria-label="plus">+</button></div>`);
  const [mi, pl] = st.querySelectorAll('button'); const nb = st.querySelector('b');
  mi.onclick = () => { d.enf = Math.max(0, d.enf - 1); nb.textContent = d.enf; save(); }; pl.onclick = () => { d.enf = Math.min(12, d.enf + 1); nb.textContent = d.enf; save(); };
  field('Nombre d’enfants', st);
  const met = input('metier', 'Mon métier (exemple : cuisinier)');
  const tw = chips('trav', [['oui', 'Je travaille'], ['cherche', 'Je cherche du travail'], ['forma', 'Je suis en formation']], false, () => { met.parentNode.style.display = d.trav === 'oui' ? '' : 'none'; });
  field('Le travail', tw);
  field('Mon métier', met).parentNode.style.display = d.trav === 'oui' ? '' : 'none';
  const err = $('<p class="err"></p>'); c.append(err);
  const go = $('<button class="btn pri wide">Je vois ma présentation</button>'); c.append(go);
  go.onclick = () => {
    const miss = []; if (!d.prenom.trim()) miss.push('le prénom'); if (!d.sexe) miss.push('homme ou femme'); if (!(+d.age > 0)) miss.push('l’âge'); if (d.nat === '') miss.push('la nationalité'); if (!d.ville.trim()) miss.push('la ville');
    if (miss.length) { err.textContent = 'Il manque : ' + miss.join(', ') + '.'; return; }
    err.textContent = ''; showPara();
  };
  app.append(c);
  function paragraph() {
    const f = d.sexe === 'f'; const n = NATS[+d.nat];
    const lg = d.langues.length ? d.langues.length === 1 ? d.langues[0] : d.langues.slice(0, -1).join(', ') + ' et ' + d.langues.at(-1) : '';
    const sit = { celib: 'célibataire', marie: f ? 'mariée' : 'marié', divorce: f ? 'divorcée' : 'divorcé', veuf: f ? 'veuve' : 'veuf' }[d.sit];
    const P = [];
    P.push(`Bonjour ! Je m’appelle <b>${cap(d.prenom.trim())}${d.nom.trim() ? ' ' + d.nom.trim().toUpperCase() : ''}</b>.`);
    P.push(`J’ai <b>${+d.age} ans</b>.`);
    P.push(`Je suis <b>${f ? n.f : n.m}</b>, je viens <b>${n.p}</b>.`);
    P.push(`J’habite à <b>${cap(d.ville.trim())}</b>.`);
    if (lg) P.push(`Je parle <b>${lg}</b>.`);
    if (sit) P.push(`Je suis <b>${sit}</b>.`);
    P.push(d.enf === 0 ? 'Je n’ai pas d’enfant.' : d.enf === 1 ? 'J’ai <b>un enfant</b>.' : `J’ai <b>${d.enf} enfants</b>.`);
    if (d.trav === 'oui' && d.metier.trim()) P.push(`Je suis <b>${d.metier.trim().toLowerCase()}</b>.`);
    else if (d.trav === 'cherche') P.push('Je cherche du travail.');
    else if (d.trav === 'forma') P.push('Je suis en formation de français.');
    return P.join(' ');
  }
  function showPara() {
    const html = paragraph();
    app.innerHTML = ''; app.append(topbar(S.game, gMoi));
    const k = $(`<div class="card narrow form"><p style="margin:0;font-weight:700;font-size:19px">Voici ma présentation. Je la lis à voix haute, puis je la recopie dans mon cahier.</p><div class="para">${html}</div></div>`);
    const t = $('<div class="tools"></div>');
    const b1 = $('<button class="btn">🔊 Écouter</button>'); b1.onclick = () => speak(html);
    const b2 = $('<button class="btn">Modifier</button>'); b2.onclick = gMoi;
    const b3 = $('<button class="btn pri">J’envoie à mon formateur</button>');
    b3.onclick = () => { logAnswer('Ma présentation', html, '', true); logGame(1, 1, 0, 3); store.set(keyOf(S.theme, 'moi'), 3); b3.disabled = true; b3.textContent = '✓ Envoyé !'; speak('Bravo ! C’est envoyé.'); };
    t.append(b1, b2, b3); k.append(t); k.append($(`<p class="sync" id="sync">${syncTxt()}</p>`));
    app.append(k); setTimeout(() => speak(html), 300);
  }
}

  '<rect x="660" y="110" width="125" height="360" rx="4" fill="#F3E6D3" stroke="#7A5428" stroke-width="5"/><line x1="660" y1="250" x2="785" y2="250" stroke="#7A5428" stroke-width="4"/><path d="M660 112 L628 128 L628 452 L660 468 Z" fill="#C48A55" stroke="#7A5428" stroke-width="3"/>';

const SPOTS = [
  { t: 'sur le frigo', p: 'sur', x: 90, y: 168, s: 1.1, lv: 1 }, { t: 'devant le frigo', p: 'devant', x: 100, y: 500, s: 1.5, lv: 2 },
  { t: 'sur la table', p: 'sur', x: 300, y: 318, s: 1.1, lv: 1 }, { t: 'sous la table', p: 'sous', x: 300, y: 458, s: 1.1, f: 1, lv: 1 },
  { t: 'entre la table et la chaise', p: 'entre', x: 428, y: 458, s: 1, lv: 2 }, { t: 'sur la chaise', p: 'sur', x: 498, y: 360, s: 1, f: 1, lv: 1 },
  { t: 'sur la lampe', p: 'sur', x: 586, y: 194, s: 1, lv: 1 }, { t: 'à côté de l’armoire', p: 'à côté de', x: 626, y: 458, s: 1, f: 1, lv: 1 },
  { t: 'dans l’armoire', p: 'dans', x: 720, y: 238, s: 1.1, lv: 1 }, { t: 'sur la fenêtre', p: 'sur', x: 440, y: 168, s: 1, f: 1, lv: 1 },
  { t: 'derrière le carton', p: 'derrière', x: 250, y: 488, s: 1.2, lv: 2, behind: 1 },
];
function sceneMini() { return `<g transform="scale(.275) translate(0,-90)">${ROOM}${CARTON}${mouseSVG(300, 318, 1.6)}${mouseSVG(720, 238, 1.6)}</g>`; }
function gSouris(id) {
  const lvl = id === 's1' ? 1 : 2, listen = id === 's3';
  const visible = SPOTS.filter(s => lvl === 2 || s.lv === 1);
  runSeries(shuffle(visible).slice(0, 8), (a, ctx) => {
    const rest = (s) => s.t.slice(s.p.length + 1);
    const phrase = 'Touche la souris ' + a.t + '.';
    let html = ROOM;
    visible.filter(s => s.behind).forEach(s => html += `<g class="m" data-k="${SPOTS.indexOf(s)}"><circle class="halo" cx="${s.x}" cy="${s.y - 8}" r="30" fill="transparent"/>${mouseSVG(s.x, s.y, s.s, s.f)}</g>`);
    html += CARTON;
    visible.filter(s => !s.behind).forEach(s => html += `<g class="m" data-k="${SPOTS.indexOf(s)}"><circle class="halo" cx="${s.x}" cy="${s.y}" r="${36 * s.s}" fill="transparent"/>${mouseSVG(s.x, s.y, s.s, s.f)}</g>`);
    const media = $(`<div class="ph"><svg class="scene act" viewBox="0 0 800 540">${html}</svg><span class="count">${ctx.count}</span></div>`);
    const shown = listen ? 'J’écoute la phrase et je touche la bonne souris.' : `Touche la souris <span class="hlp">${a.p}</span> ${rest(a)}.`;
    const { g, side } = gcard(media, shown, phrase);
    const ms = [...media.querySelectorAll('.m')];
    ms.forEach(m => m.addEventListener('click', () => {
      const s = SPOTS[+m.dataset.k]; const ok = s === a;
      mark(ms, m, x => SPOTS[+x.dataset.k] === a);
      ctx.answer(ok, { q: 'Souris : ' + a.t, r: s.t, a: a.t, right: `La souris est <span class="hlp">${a.p}</span> ${rest(a)}.`, say: 'La souris est ' + a.t + '.' });
    }));
    if (listen) setTimeout(() => speak(phrase), 300);
    return g;
  }, backList);
}

  qr: gQR, fiche: gFiche, age: gAge,
  cache: gCache, sac: gSac, meles: gMeles, fleches: gFleches, gram: gGram, ou: gOu, nat: gNat, phrase: gPhrase, vf: gVF, lecture: gLecture, lucia: gLucia, moi: gMoi,
  s1: () => gSouris('s1'), s2: () => gSouris('s2'), s3: () => gSouris('s3'),
