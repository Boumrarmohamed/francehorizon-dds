<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Tableau de bord formateur · Syllabes et mots</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Tableau de bord : résumé en haut, liste des stagiaires, détail réponse par réponse. */
:root{--bg:#F4F5F8;--card:#fff;--ink:#1F2440;--muted:#5D6280;--line:#E2E4EC;--blue:#2F5BD3;--green:#1E7B4F;--red:#C0392B;--gold:#E0A526;--okbg:#E3F3EA;--nobg:#FBE9E7;--chip:#EEF0F6;
  --font:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#141824;--card:#1E2333;--ink:#EEF0F6;--muted:#A9AFC2;--line:#323A50;--blue:#8FB0FF;--green:#5DD39E;--red:#FF8A80;--okbg:#173327;--nobg:#3A1E1E;--chip:#272D40;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px}
.wrap{max-width:1150px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left,0px)) 40px}
h1{font-size:24px;margin:0}h2{font-size:18px;margin:22px 0 10px}
.muted{color:var(--muted)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.btn{border:0;border-radius:10px;padding:9px 14px;font-family:inherit;font-weight:600;background:var(--chip);color:var(--ink);cursor:pointer;font-size:14px}
.btn.pri{background:var(--blue);color:#fff}.btn.on{background:var(--ink);color:var(--bg)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.k b{display:block;font-size:26px;font-variant-numeric:tabular-nums}.k span{color:var(--muted);font-size:13px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;vertical-align:middle;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:var(--chip)}
td.wrap{white-space:normal;min-width:220px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--chip)}
.pct{display:inline-flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.bar{width:70px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.ok{color:var(--green);font-weight:700}.no{color:var(--red);font-weight:700}
tr.bad td{background:var(--nobg)}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--chip)}
.a1{background:var(--okbg);color:var(--green)}.a2{background:#DCE7FF;color:#2F5BD3}
.login{max-width:420px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.login input{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);margin-top:10px}
.err{color:var(--red);min-height:22px;margin-top:8px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.tools label{display:flex;gap:6px;align-items:center;font-size:14px}
.stars{color:var(--gold)}
@media (max-width:760px){.cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
const SB_URL = 'https://srhqqovedripajxzaovk.supabase.co/rest/v1';
const SB_KEY = 'sb_publishable_x9PxEbB9zwxoFKRVHMgpSA_lqjbRcNv';
const root = document.getElementById('root');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function rpc(fn, body) {
  const r = await fetch(`${SB_URL}/rpc/${fn}`, { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const j = await r.json().catch(() => null); if (!r.ok) throw new Error((j && j.message) || 'erreur'); return j;
}
let CODE = null; try { CODE = sessionStorage.getItem('dds_code'); } catch (e) {}
let PERIOD = 'today', P = [], R = [], SEL = null, ONLYBAD = false, timer = null;
const fmt = (d) => new Date(d).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const since = () => { const d = new Date(); if (PERIOD === 'today') { d.setHours(0, 0, 0, 0); return d; } if (PERIOD === '7') return new Date(Date.now() - 7 * 864e5); if (PERIOD === '30') return new Date(Date.now() - 30 * 864e5); return new Date('2020-01-01'); };
const THEMES = { corps: 'Le corps', transports: 'Les transports', metiers: 'Les métiers', logement: 'Le logement', presentation: 'Se présenter', souris: 'Où est la souris ?' };

async function start() {
  let defined = true; try { defined = await rpc('dds_code_defini'); } catch (e) {}
  if (CODE) return load();
  root.innerHTML = `<div class="login"><h1>Tableau de bord formateur</h1><p class="muted">${defined ? 'J’entre mon code formateur.' : 'Première connexion : je choisis mon code formateur (6 caractères minimum). Je le garde pour moi : il protège les résultats.'}</p>
    <input id="c1" type="password" autocomplete="current-password" placeholder="Code formateur">${defined ? '' : '<input id="c2" type="password" autocomplete="new-password" placeholder="Je confirme le code">'}
    <div class="err" id="er"></div><button class="btn pri" id="go" style="margin-top:8px">${defined ? 'Entrer' : 'Créer mon code'}</button></div>`;
  const go = async () => {
    const c1 = document.getElementById('c1').value.trim(), er = document.getElementById('er');
    if (!defined) {
      const c2 = document.getElementById('c2').value.trim();
      if (c1.length < 6) return er.textContent = 'Le code doit avoir au moins 6 caractères.';
      if (c1 !== c2) return er.textContent = 'Les deux codes ne sont pas pareils.';
      const ok = await rpc('dds_definir_code', { p_code: c1 }).catch(() => false);
      if (!ok) return er.textContent = 'Le code existe déjà. Recharge la page et entre ton code.';
    }
    try { await rpc('dds_lire_parties', { p_code: c1, p_depuis: new Date().toISOString() }); } catch (e) { return er.textContent = 'Code incorrect.'; }
    CODE = c1; try { sessionStorage.setItem('dds_code', c1); } catch (e) {} load();
  };
  document.getElementById('go').onclick = go;
  root.querySelectorAll('input').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') go(); });
}
async function load() {
  try {
    const d = since().toISOString();
    [P, R] = await Promise.all([rpc('dds_lire_parties', { p_code: CODE, p_depuis: d }), rpc('dds_lire_reponses', { p_code: CODE, p_depuis: d })]);
  } catch (e) { CODE = null; try { sessionStorage.removeItem('dds_code'); } catch (x) {} return start(); }
  render();
  clearTimeout(timer); timer = setTimeout(load, 30000);
}
function render() {
  const by = {};
  R.forEach(r => { const s = by[r.eleve] || (by[r.eleve] = { eleve: r.eleve, rep: 0, ok: 0, parties: 0, last: r.created_at, stars: 0 }); s.rep++; if (r.correct) s.ok++; if (r.created_at > s.last) s.last = r.created_at; });
  P.forEach(p => { const s = by[p.eleve] || (by[p.eleve] = { eleve: p.eleve, rep: 0, ok: 0, parties: 0, last: p.created_at, stars: 0 }); s.parties++; s.stars += p.etoiles || 0; if (p.created_at > s.last) s.last = p.created_at; });
  const list = Object.values(by).sort((a, b) => b.last.localeCompare(a.last));
  const tot = R.length, ok = R.filter(r => r.correct).length;
  const per = (n, d) => d ? Math.round(100 * n / d) : 0;
  let h = `<header><div><h1>Tableau de bord · Syllabes et mots</h1><p class="muted" style="margin:4px 0 0">Mise à jour automatique toutes les 30 secondes · dernière : ${new Date().toLocaleTimeString('fr-FR')}</p></div>
    <div class="seg">${[['today', 'Aujourd’hui'], ['7', '7 jours'], ['30', '30 jours'], ['all', 'Tout']].map(([k, l]) => `<button class="btn ${PERIOD === k ? 'on' : ''}" data-p="${k}">${l}</button>`).join('')}<button class="btn" id="rf">Actualiser</button><button class="btn" id="csv">Export CSV</button><button class="btn" id="out">Quitter</button></div></header>
    <div class="cards"><div class="k"><b>${list.length}</b><span>stagiaires actifs</span></div><div class="k"><b>${P.length}</b><span>parties terminées</span></div><div class="k"><b>${tot}</b><span>réponses</span></div><div class="k"><b>${per(ok, tot)} %</b><span>bonnes réponses</span></div></div>`;
  if (!SEL) {
    h += `<h2>Les stagiaires</h2><div class="box scroll"><table><tr><th>Prénom</th><th>Dernière activité</th><th>Parties</th><th>Réponses</th><th>Réussite</th><th>Étoiles (moy.)</th></tr>` +
      (list.length ? list.map(s => `<tr class="click" data-e="${esc(s.eleve)}"><td><b>${esc(s.eleve)}</b></td><td>${fmt(s.last)}</td><td>${s.parties}</td><td>${s.rep}</td><td><span class="pct"><span class="bar"><i style="width:${per(s.ok, s.rep)}%"></i></span>${per(s.ok, s.rep)} %</span></td><td class="stars">${s.parties ? (s.stars / s.parties).toFixed(1) + ' ★' : '–'}</td></tr>`).join('') : `<tr><td colspan="6" class="muted">Pas encore de réponse sur cette période. Les réponses arrivent dès qu’un stagiaire joue.</td></tr>`) + `</table></div>`;
    const hard = {}; R.forEach(r => { const k = r.question; const x = hard[k] || (hard[k] = { q: k, jeu: r.jeu, n: 0, bad: 0 }); x.n++; if (!r.correct) x.bad++; });
    const H = Object.values(hard).filter(x => x.bad).sort((a, b) => b.bad - a.bad).slice(0, 12);
    h += `<h2>Ce qui est difficile pour le groupe</h2><div class="box scroll"><table><tr><th>Question</th><th>Jeu</th><th>Erreurs</th><th>Réponses</th></tr>` +
      (H.length ? H.map(x => `<tr><td class="wrap">${esc(x.q)}</td><td>${esc(x.jeu)}</td><td class="no">${x.bad}</td><td>${x.n}</td></tr>`).join('') : '<tr><td colspan="4" class="muted">Aucune erreur pour l’instant.</td></tr>') + `</table></div>`;
  } else {
    const myP = P.filter(p => p.eleve === SEL), myR = R.filter(r => r.eleve === SEL && (!ONLYBAD || !r.correct));
    h += `<div class="tools"><button class="btn" id="bk">‹ Tous les stagiaires</button><h2 style="margin:0 8px">${esc(SEL)}</h2><button class="btn" id="rn">Renommer / fusionner</button></div>
      <h2>Parties</h2><div class="box scroll"><table><tr><th>Date</th><th>Niveau</th><th>Thème</th><th>Jeu</th><th>Score</th><th>Erreurs</th><th>Étoiles</th><th>Durée</th></tr>` +
      (myP.length ? myP.map(p => `<tr><td>${fmt(p.created_at)}</td><td><span class="pill ${String(p.niveau).toLowerCase()}">${esc(p.niveau)}</span></td><td>${esc(THEMES[p.theme] || p.theme)}</td><td>${esc(p.jeu)}</td><td>${p.score} / ${p.total}</td><td>${p.erreurs}</td><td class="stars">${'★'.repeat(p.etoiles || 0)}</td><td>${Math.floor(p.duree_s / 60)} min ${p.duree_s % 60} s</td></tr>`).join('') : '<tr><td colspan="8" class="muted">Pas de partie terminée sur cette période.</td></tr>') + `</table></div>
      <div class="tools"><h2 style="margin:0">Réponses une par une</h2><label><input type="checkbox" id="ob" ${ONLYBAD ? 'checked' : ''}> seulement les erreurs</label></div>
      <div class="box scroll"><table><tr><th>Heure</th><th>Jeu</th><th>Question</th><th>Sa réponse</th><th>Bonne réponse</th><th></th></tr>` +
      (myR.length ? myR.map(r => `<tr class="${r.correct ? '' : 'bad'}"><td>${fmt(r.created_at)}</td><td>${esc(r.jeu)}</td><td class="wrap">${esc(r.question)}</td><td>${esc(r.reponse)}</td><td>${esc(r.attendu)}</td><td class="${r.correct ? 'ok' : 'no'}">${r.correct ? '✓' : '✗'}</td></tr>`).join('') : '<tr><td colspan="6" class="muted">Rien à afficher.</td></tr>') + `</table></div>`;
  }
  root.innerHTML = h;
  root.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { PERIOD = b.dataset.p; load(); });
  root.querySelectorAll('[data-e]').forEach(tr => tr.onclick = () => { SEL = tr.dataset.e; render(); window.scrollTo(0, 0); });
  document.getElementById('rf').onclick = load;
  document.getElementById('out').onclick = () => { try { sessionStorage.removeItem('dds_code'); } catch (e) {} CODE = null; clearTimeout(timer); start(); };
  document.getElementById('csv').onclick = () => {
    const rows = [['date', 'eleve', 'niveau', 'theme', 'jeu', 'question', 'reponse', 'attendu', 'correct']].concat(R.map(r => [r.created_at, r.eleve, r.niveau, r.theme, r.jeu, r.question, r.reponse, r.attendu, r.correct ? 'oui' : 'non']));
    const csv = '﻿' + rows.map(r => r.map(x => '"' + String(x ?? '').replace(/"/g, '""') + '"').join(';')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'resultats-dds.csv'; a.click();
  };
  const bk = document.getElementById('bk'); if (bk) bk.onclick = () => { SEL = null; render(); };
  const ob = document.getElementById('ob'); if (ob) ob.onchange = () => { ONLYBAD = ob.checked; render(); };
  const rn = document.getElementById('rn'); if (rn) rn.onclick = async () => {
    const box = document.createElement('div'); box.className = 'tools';
    box.innerHTML = `<label>Nouveau prénom : <input id="nn" style="font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line)"></label><button class="btn pri" id="ok2">Valider</button>`;
    rn.after(box); box.querySelector('#ok2').onclick = async () => { const v = box.querySelector('#nn').value.trim(); if (!v) return; await rpc('dds_renommer_eleve', { p_code: CODE, p_ancien: SEL, p_nouveau: v }); SEL = v; load(); };
  };
}
start();
</script>
</body>
</html>
